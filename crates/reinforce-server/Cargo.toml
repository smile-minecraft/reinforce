[package]
name = "reinforce-server"
description = "Reinforce server, CLI and HTTP API entrypoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "reinforce"
path = "src/main.rs"

[lib]
name = "reinforce_server"
path = "src/lib.rs"

[dependencies]
argon2.workspace = true
axum.workspace = true
clap.workspace = true
futures-util.workspace = true
rand.workspace = true
reinforce-core.workspace = true
rmcp = { version = "3.11", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
rust-embed.workspace = true
schemars = "1"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
jsonschema = { version = "0.63", default-features = false }

[lints]
workspace = true
