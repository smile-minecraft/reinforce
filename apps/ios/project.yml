name: Reinforce
options:
  bundleIdPrefix: app.reinforce
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions:
    - en
    - zh-Hant

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  Reinforce:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Generated/swift/reinforce_ffi.swift
      - path: Resources/Assets.xcassets
      - path: Resources/en.lproj
        type: folder
        buildPhase: resources
      - path: Resources/zh-Hant.lproj
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Generated/ReinforceFFI.xcframework
        embed: false
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Reinforce
        CFBundleURLTypes:
          - CFBundleURLName: app.reinforce.ios.deeplink
            CFBundleURLSchemes:
              - reinforce
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.reinforce.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  ReinforceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
      - path: ../../fixtures/demo
        type: folder
        buildPhase: resources
      - path: TestFixtures/practical_demo
        type: folder
        buildPhase: resources
    dependencies:
      - target: Reinforce
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.reinforce.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"

  ReinforceUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
      - path: ../../fixtures/demo
        type: folder
        buildPhase: resources
      - path: TestFixtures/practical_demo
        type: folder
        buildPhase: resources
    dependencies:
      - target: Reinforce
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.reinforce.ios.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Reinforce

schemes:
  Reinforce:
    build:
      targets:
        Reinforce: all
        ReinforceTests: [test]
        ReinforceUITests: [test]
    test:
      targets:
        - ReinforceTests
        - ReinforceUITests
